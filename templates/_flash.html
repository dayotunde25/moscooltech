{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="px-3 pt-3">
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else ('info' if category == 'info' else 'danger') }} alert-dismissible fade show mb-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
